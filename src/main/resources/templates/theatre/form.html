<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New theatre</title>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<h1>New theatre</h1>
<form th:action="@{/theatres}" th:object="${theatre}" method="post">
    id: <input type="hidden" th:field="*{id}"> <br>
    name: <input type="text" th:field="*{name}"> <br>
    city: <input type="text" th:field="*{city}"> <br>
    available: <input type="checkbox" th:field="*{available}"><br>
    <button type = "submit">Save new theatre</button>
</form>

</body>
</html>
