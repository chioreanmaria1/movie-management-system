<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Customer</title>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<h1>Edit Customer</h1>
<form th:action="@{'/customers/'+${customer.id}+'/edit'}" th:object="${customer}" method="post">
    id: <input type="text" th:field="*{id}" readonly> <br>
    name: <input type="text" th:field="*{name}"> <br>
    birthDate: <input type="date" th:field="*{birthDate}"><br>
    <button type="submit">Save changes</button>
</form>
</body>
</html>
