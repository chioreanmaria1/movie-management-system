<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customers</title>
</head>
<body>
<h1> Customers </h1>
<a href="/customers/new">Add new Customer</a>
<table border="2">
    <tr>
        <th>id</th>
        <th>name</th>
        <th>birthYear</th>
    </tr>
    <tr th:each="item: ${customers}">
        <td th:text="${item.id}"> </td>
        <td th:text="${item.name}"> </td>
        <td th:text="${item.birthYear}">  </td>
        <td>
            <form th:action="@{'/customers/'+${item.id}+'/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
