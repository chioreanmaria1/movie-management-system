<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Customer</title>
</head>
<body>
<p> New Customer </p>
<form th:action="@{/customers}" th:object="${customer}" method="post">
    id: <input type="text" th:field="*{id}"> <br>
    name: <input type="text" th:field="*{name}"> <br>
    birthYear: <input type="number" th:field="*{birthYear}"> <br>
    <button type="submit">Save new customer</button>

</form>
</body>
</html>
