<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movies</title>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<h1>Movies</h1>
<p>
    <a href="/movies/new"> Add new movie</a>
</p>

<table border="2">
    <tr>
        <th>id</th>
        <th>title</th>
        <th>genre</th>
        <th>ageRestricted</th>
        <th>durationMin</th>
        <th>Delete</th>
    </tr>
    <tr th:each="movie: ${movies}">
        <td th:text="${movie.id}"></td>
        <td th:text="${movie.title}"></td>
        <td th:text="${movie.genre}"></td>
        <td th:text="${movie.ageRestricted}"></td>
        <td th:text="${movie.durationMin}"></td>
        <td>
            <form th:action="@{'/movies/'+${movie.id}+'/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
