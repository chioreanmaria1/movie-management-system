<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movie details</title>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<h1>Movie details</h1>
<p>id: <span th:text="${movie.id}"></span></p>
<p>title: <span th:text="${movie.title}"></span></p>
<p>genre: <span th:text="${movie.genre}"></span></p>
<p>ageRestricted: <span th:text="${movie.ageRestricted}"></span></p>
<p>durationMin: <span th:text="${movie.durationMin}"></span></p>

<h2>Screenings</h2>

<table border = "2" th:if="${!screenings.isEmpty()}">
    <tr>
        <th>id</th>
        <th>hallId</th>
        <th>movieId</th>
        <th>date</th>
        <th>details</th>
    </tr>
    <tr th:each="screening: ${screenings}">
        <td th:text="${screening.id}"></td>
        <td th:text="${screening.hallId}"></td>
        <td th:text="${screening.movieId}"></td>
        <td th:text="${screening.date}"></td>
        <td>
            <a th:href="@{'/screenings/' + ${screening.id}}">Details</a>
        </td>
    </tr>
</table>
<p th:if="${screenings.isEmpty()}">This hall has no screenings.</p>
</body>
</html>
