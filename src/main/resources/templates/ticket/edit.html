<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit ticket</title>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<h1>Edit ticket</h1>
<form th:action="@{'/tickets/'+${ticket.id}+'/edit'}" th:object="${ticket}" method="post">
    id: <input type="text" th:field="*{id}" readonly> <br>
    screeningId: <input type="text" th:field="*{screeningId}"> <br>
    customerId: <input type="text" th:field="*{customerId}"> <br>
    seatId: <input type="text" th:field="*{seatId}"> <br>
    price: <input type="text" th:field="*{price}"> <br>
    <button type="submit">Save changes</button>
</form>
</body>
</html>
