<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Seat details</title>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<h1>Seat details</h1>

<p>available: <span th:text="${seat.available}"></span></p>

</body>
</html>
