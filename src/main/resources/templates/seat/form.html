<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New seat</title>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<h1>New seat</h1>
<form th:action="@{/seats}" th:object="${seat}" method="post">
    id: <input type="text" th:field="*{id}"><br>
    hallId: <input type="text" th:field="*{hallId}"><br>
    row: <input type="text" th:field="*{row}"> <br>
    column: <input type="text" th:field="*{column}"> <br>
    available: <input type="checkbox" th:field="*{available}"> <br>
    <button type="submit">Save new seat</button>
</form>
</body>
