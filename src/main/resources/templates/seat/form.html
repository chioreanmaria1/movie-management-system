<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New seat</title>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<h1>New seat</h1>
<form th:action="@{/seats}" th:object="${seat}" method="post">
    hallId: <input type="text" th:field="*{hallId}"><br>
    row:
    <select th:field="*{row}">
        <option th:each="rowItem : ${rows}" th:value="${rowItem}" th:text="${rowItem}"></option>
    </select> <br>
    column:
    <select th:field="*{column}">
        <option th:each="columnItem : ${columns}" th:value="${columnItem}" th:text="${columnItem}"></option>
    </select> <br>
    available: <input type="checkbox" th:field="*{available}"> <br>
    <button type="submit">Save new seat</button>
</form>
</body>
