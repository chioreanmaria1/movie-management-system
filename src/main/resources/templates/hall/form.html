<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New theatre</title>
</head>
<body>
<p> New hall </p>
<form th:action="@{/halls}" th:object="${hall}" method="post">
    id: <input type="text" th:field="*{id}"> <br>
    name: <input type="text" th:field="*{name}"> <br>
    theatreId: <input type="text" th:field="*{theatreId}"> <br>
    capacity: <input type="text" th:field="*{capacity}"> <br>
    available: <input type="checkbox" th:field="*{available}"> <br>
    <button type="submit">Save new hall</button>

</form>
</body>
</html>
