<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Screening details</title>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<h1>Screening details</h1>
<p>id: <span th:text="${screening.id}"></span></p>
<p>hallId: <span th:text="${screening.hallId}"></span></p>
<p>movieId: <span th:text="${screening.movieId}"></span></p>
<p>date: <span th:text="${screening.date}"></span></p>

<h1>Assignments</h1>
<table border="2" th:if="${!assignments.isEmpty()}">
    <tr>
        <th>id</th>
        <th>screeningId</th>
        <th>staffId</th>
        <th>details</th>
    </tr>
    <tr th:each="item: ${assignments}">
        <td th:text="${item.id}"> </td>
        <td th:text="${item.screeningId}"> </td>
        <td th:text="${item.staffId}">  </td>
        <td>
            <a th:href="@{'/staffassignments/' + ${item.id}}">Details</a>
        </td>
    </tr>
</table>
<p th:if="${assignments.isEmpty()}">This screening has no assignments.</p>
<h2>Tickets</h2>
<table border="2" th:if="${!tickets.isEmpty()}">
    <tr>
        <th>id</th>
        <th>screeningId</th>
        <th>customerId</th>
        <th>seatId</th>
        <th>price</th>
        <th>details</th>
    </tr>
    <tr th:each="item: ${tickets}">
        <td th:text="${item.id}"> </td>
        <td th:text="${item.screeningId}"> </td>
        <td th:text="${item.customerId}">  </td>
        <td th:text="${item.seatId}">  </td>
        <td th:text="${item.price}">  </td>
        <td>
            <a th:href="@{'/tickets/' + ${item.id}}">Details</a>
        </td>
    </tr>
</table>
<p th:if="${tickets.isEmpty()}">This screening has no tickets.</p>
</body>
</html>
