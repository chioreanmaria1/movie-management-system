<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Support Staff</title>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<p> New Support Staff </p>
<form th:action="@{/supportstaff}" th:object="${supportStaff}" method="post">
    id: <input type="text" th:field="*{id}"> <br>
    name: <input type="text" th:field="*{name}"> <br>
    role: <select th:field="*{role}">
        <option th:each="roleItem: ${roles}" th:value="${roleItem}" th:text="${roleItem}"></option>
    </select> <br>
    <button type="submit">Save new support staff</button>

</form>
</body>
</html>
